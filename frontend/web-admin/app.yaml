runtime: nodejs22
instance_class: F1
automatic_scaling:
  max_instances: 5

handlers:
# Melayani aset statis agar langsung diakses oleh browser
- url: /assets
  static_dir: dist/assets
- url: /(.*\..+)$
  static_files: dist/\1
  upload: dist/(.*\..+)$
- url: /.*
  static_files: dist/index.html
  upload: dist/index.html